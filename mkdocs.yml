# Site
site_name: NavArena Docs
site_description: Documentation for NavArena asset preprocessing, data generation, evaluation, and developer workflows
site_author: NavArena Team
site_url: https://ei-nav.github.io/NavArena-Doc/

# Repository (header icon -> main repo; edit link -> doc repo)
repo_name: EI-Nav/NavArena
repo_url: https://github.com/EI-Nav/NavArena
edit_uri: https://github.com/EI-Nav/NavArena-Doc/edit/docs/docs/

copyright: Copyright &copy; 2026 NavArena Team

theme:
  name: material
  language: en
  custom_dir: overrides

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  favicon: assets/images/favicon.svg

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/extra.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/EI-Nav/NavArena

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - guide/index.md
    - Core Library: core/index.md
    - Asset Preprocessing:
      - asset-preprocessing/index.md
      - Pipeline Steps: asset-preprocessing/pipeline-steps.md
      - Configuration: asset-preprocessing/configuration.md
      - CLI Commands: asset-preprocessing/cli.md
      - Web Viewer: asset-preprocessing/web-viewer.md
    - Data Generator:
      - data-generator/index.md
      - Pipeline Stages: data-generator/pipeline.md
      - Configuration: data-generator/configuration.md
      - Batch Processing: data-generator/batch-processing.md
    - Evaluation Framework:
      - navarena-bench/index.md
      - Environment: navarena-bench/environment.md
      - Agents: navarena-bench/agents.md
      - Evaluators: navarena-bench/evaluators.md
      - Replay: navarena-bench/replay.md
      - Extending: navarena-bench/extending.md
  - Reference:
    - reference/index.md
    - API Documentation: api/reference.md
    - Data Generator API: api/data-generator-api.md
    - Evaluation Framework API: api/navarena-bench-api.md
    - 3D GS Asset Specification: definitions/gs-assets.md
    - Navigation Training Data Format: definitions/nav-data-format.md
    - Navigation Evaluation Data Format: definitions/eval-data-format.md
  - Concepts & Architecture:
    - concepts/index.md
    - Core Concepts: definitions/concepts.md
    - Architecture: concepts/architecture.md
  - Developer Guide:
    - dev/index.md
    - Contributing: dev/contributing.md
    - Changelog: dev/changelog.md
  - Troubleshooting: troubleshooting.md
