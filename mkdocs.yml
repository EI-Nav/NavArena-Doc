# 站点信息
site_name: NavArena 开发者文档
site_description: 完整的 NavArena 具身导航项目开发文档，包含 API 参考、教程和使用指南
site_author: NavArena Team
site_url: https://KEEPSLAMDUNK.github.io/NavArena-Doc/

# 仓库信息
repo_name: KEEPSLAMDUNK/NavArena-Doc
repo_url: https://github.com/KEEPSLAMDUNK/NavArena-Doc
edit_uri: edit/docs/docs/

# 版权信息
copyright: Copyright &copy; 2026 NavArena Team

# 主题配置
theme:
  name: material
  language: zh
  custom_dir: overrides
  
  # 颜色方案（深蓝 + 青色科技感）
  palette:
    # 亮色模式
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    # 暗色模式
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式
  
  # 字体
  font:
    text: Inter
    code: JetBrains Mono
  
  # 图标
  icon:
    logo: material/library
    repo: fontawesome/brands/github
  
  # 功能特性
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.tabs.link
    - header.autohide
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

# 插件
plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\-\.]+'
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            快速开始: Getting Started
            安装指南: Installation
            快速入门: Quickstart
            规范定义: Specifications
            3D GS 资产规范: 3D GS Asset Specification
            具身导航训练数据格式: Navigation Training Data Format
            具身导航评测数据格式: Navigation Evaluation Data Format
            资产预处理: Asset Preprocessing
            Pipeline 步骤: Pipeline Steps
            CLI 命令: CLI Commands
            Web 查看器: Web Viewer
            数据生成器: Data Generator
            概述: Overview
            Pipeline 阶段详解: Pipeline Stages
            配置说明: Configuration
            批量处理: Batch Processing
            评测框架: Evaluation Framework
            环境模块: Environment
            智能体模块: Agents
            评测器模块: Evaluators
            回放模块: Replay
            扩展指南: Extending
            API 参考: API Reference
            API 文档: API Documentation
            数据生成器 API: Data Generator API
            评测框架 API: Evaluation Framework API
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      timezone: Asia/Shanghai
      fallback_to_build_date: true
  - minify:
      minify_html: true

# Markdown 扩展
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# 额外 JavaScript
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/extra.js

# 额外 CSS
extra_css:
  - stylesheets/extra.css

# 额外配置
extra:
  # 语言切换器
  alternate:
    - name: 简体中文
      link: /zh/
      lang: zh
    - name: English
      link: /en/
      lang: en
  
  # 社交链接
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KEEPSLAMDUNK/NavArena-Doc

# 导航结构
nav:
  - 首页: index.md
  - 快速开始:
    - 安装指南: getting-started/installation.md
    - 快速入门: getting-started/quickstart.md
  - 规范定义:
    - 3D GS 资产规范: definitions/gs-assets.md
    - 具身导航训练数据格式: definitions/nav-data-format.md
    - 具身导航评测数据格式: definitions/eval-data-format.md
  - 资产预处理:
    - 概述: asset-preprocessing/overview.md
    - Pipeline 步骤: asset-preprocessing/pipeline-steps.md
    - 配置说明: asset-preprocessing/configuration.md
    - CLI 命令: asset-preprocessing/cli.md
    - Web 查看器: asset-preprocessing/web-viewer.md
  - 数据生成器:
    - 概述: data-generator/overview.md
    - Pipeline 阶段详解: data-generator/pipeline.md
    - 配置说明: data-generator/configuration.md
    - 批量处理: data-generator/batch-processing.md
  - 评测框架:
    - 概述: x2robot-nav/overview.md
    - 环境模块: x2robot-nav/environment.md
    - 智能体模块: x2robot-nav/agents.md
    - 评测器模块: x2robot-nav/evaluators.md
    - 回放模块: x2robot-nav/replay.md
    - 扩展指南: x2robot-nav/extending.md
  - API 参考:
    - API 文档: api/reference.md
    - 数据生成器 API: api/data-generator-api.md
    - 评测框架 API: api/x2robot-nav-api.md